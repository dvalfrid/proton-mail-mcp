# Keeps the SHA-pinned actions, the Go modules and the pinned tools current,
# weekly, one grouped PR per ecosystem. Commit subjects follow the repo format
# (`build(deps): …`), which release-please leaves out of the changelog.
#
# Only updates that should be safe to merge on a green CI: no major versions.
# Bigger updates are done on purpose, as their own issue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directories:
      - /
      - /tools
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
