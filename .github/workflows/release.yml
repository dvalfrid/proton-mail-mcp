name: Release

# Builds the binaries for a release tag and attaches them, with checksums, to
# the GitHub release. The Windows binaries are signed in between
# (sign-windows), after the owner approves the release-signing environment.
# Dispatched by release-please.yml; can be re-run by hand
# for an existing tag (assets are replaced).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }

    steps:
      - name: Validate tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries are built from a fresh module download, not a
          # cache a PR build could have filled (issue #75).
          cache: false

      - name: Verify
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: pwsh
        run: ./tools/task.ps1 verify -Race

      - name: Build and package
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "proton-mail-mcp_${version}_${env:GOOS_T}_${env:GOARCH_T}"
          $exe = if ($env:GOOS_T -eq 'windows') { '.exe' } else { '' }
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          ./tools/task.ps1 build -Version $version -GOOS $env:GOOS_T -GOARCH $env:GOARCH_T -Out "dist/$name/proton-mail-mcp$exe"
          Copy-Item LICENSE, README.md, .env.example "dist/$name/"
          if ($env:GOOS_T -eq 'windows') {
            # Not Compress-Archive: it leaves out hidden files, and on Linux
            # that is .env.example (#49). .NET resolves relative paths from the
            # process directory, so the paths are absolute.
            [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD/dist/$name", "$PWD/dist/$name.zip", [System.IO.Compression.CompressionLevel]::Optimal, $true)
          } else {
            tar -C dist -czf "dist/$name.tar.gz" $name
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }

      # Windows zips go to sign-windows first; the rest straight to publish.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos == 'windows' && 'unsigned' || 'dist' }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # Signs proton-mail-mcp.exe with the company's Azure Artifact Signing (the
  # same account and certificate profile as rigstats, its own app
  # registration). It runs in the release-signing environment, which waits
  # for the owner's approval and alone can log in to Azure: by OIDC, so there
  # is no client secret (docs/installation-research.md §G1, #32).
  sign-windows:
    name: Sign Windows binaries
    needs: build
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download unsigned Windows zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-windows-*
          path: unsigned
          merge-multiple: true

      - name: Unpack
        shell: pwsh
        run: |
          $zips = Get-ChildItem unsigned -Filter *.zip
          if ($zips.Count -ne 2) { throw "expected 2 Windows zips, found $($zips.Count)" }
          foreach ($z in $zips) { Expand-Archive $z.FullName -DestinationPath unpacked }
          Get-ChildItem unpacked -Recurse -Filter *.exe | ForEach-Object FullName

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: rigstats-codesign
          certificate-profile-name: RIGStats
          files-folder: ${{ github.workspace }}\unpacked
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Only the Azure CLI login from the step above.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check signatures
        shell: pwsh
        run: |
          $exes = Get-ChildItem unpacked -Recurse -Filter *.exe
          if ($exes.Count -ne 2) { throw "expected 2 exes, found $($exes.Count)" }
          foreach ($e in $exes) {
            $s = Get-AuthenticodeSignature $e.FullName
            "$($e.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "Not validly signed: $($e.FullName) ($($s.Status))" }
          }

      - name: Repack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($dir in Get-ChildItem unpacked -Directory) {
            # As in build: keeps .env.example (#49); absolute paths for .NET.
            [System.IO.Compression.ZipFile]::CreateFromDirectory($dir.FullName, (Join-Path $PWD "dist/$($dir.Name).zip"), [System.IO.Compression.CompressionLevel]::Optimal, $true)
          }
          Get-ChildItem dist | ForEach-Object Name

      - name: Upload signed Windows zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-signed
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish to GitHub release
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Build provenance (who built what, from which commit). GitHub supports
      # attestations on public repositories, or private ones on Enterprise Cloud.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
