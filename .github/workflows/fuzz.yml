name: Fuzz

# Fuzzes the parser of untrusted mail for real. `go test` in verify runs
# only the seed examples; this runs -fuzz. A crasher is kept as an artifact:
# copy it into internal/mail/testdata/fuzz/ so it becomes a regression test.
on:
  schedule:
    - cron: "41 3 * * 3" # Wednesdays 03:41 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long to fuzz each target, e.g. 10m"
        required: false
        default: "10m"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./internal/mail, target: FuzzParseMessage }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Fuzz
        env:
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME"

      - name: Keep the crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
