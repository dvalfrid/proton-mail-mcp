<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Proton Mail MCP</title>
<style>
/* Tokens per platform (win, mac, gnome) and mode (light, dark). Windows
   follows the Windows 11 (Fluent) guidelines; mac and gnome are kept for
   issue #91. */
html, body { margin: 0; height: 100%; overflow: hidden; }
* { box-sizing: border-box; }
body { --font: system-ui; --fs: 14px; --fs-small: 12px; --fs-title: 20px; --fs-hero: 28px; --radius-ctl: 4px; --radius-card: 7px; }
body.win { --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
body.mac { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; --fs: 13px; --fs-small: 11px; --fs-title: 17px; --fs-hero: 24px; --radius-ctl: 6px; --radius-card: 10px; }
body.gnome { --font: "Adwaita Sans", "Cantarell", "Inter", system-ui, sans-serif; --fs: 15px; --fs-small: 13px; --fs-hero: 26px; --radius-ctl: 6px; --radius-card: 12px; }

.win.light   { --bg: #f3f3f3; --side: transparent; --card: #fbfbfb; --card-border: #e5e5e5; --fg: #1b1b1b; --fg2: #5c5c5c; --accent: var(--sys-accent-light, #005fb8); --accent-fg: #fff;
  --ctl: #fff; --ctl-border: #d6d6d6; --ctl-border-bottom: #8a8a8a; --sel: rgba(0,0,0,.05); --ok: #0f7b0f; --warn: #9d5d00; --warn-bg: #fff4ce; --err: #c42b1c; --err-bg: #fde7e9; }
.win.dark    { --bg: #202020; --side: transparent; --card: #2b2b2b; --card-border: #1d1d1d; --fg: #fff; --fg2: #cfcfcf; --accent: var(--sys-accent-dark, #60cdff); --accent-fg: #000;
  --ctl: #2d2d2d; --ctl-border: #3a3a3a; --ctl-border-bottom: #9a9a9a; --sel: rgba(255,255,255,.06); --ok: #6ccb5f; --warn: #fce100; --warn-bg: #433519; --err: #ff99a4; --err-bg: #442726; }
.mac.light   { --bg: #fff; --side: #e9e8ed; --card: #f5f5f7; --card-border: #e2e2e6; --fg: #1d1d1f; --fg2: #6e6e73; --accent: #007aff; --accent-fg: #fff;
  --ctl: #fff; --ctl-border: #d2d2d7; --sel: rgba(0,0,0,.06); --ok: #28a745; --warn: #a05a00; --warn-bg: #fff3d6; --err: #d70015; --err-bg: #ffe5e7; }
.mac.dark    { --bg: #1e1e1e; --side: #2b2a2f; --card: #2a2a2c; --card-border: #3a3a3c; --fg: #f5f5f7; --fg2: #98989d; --accent: #0a84ff; --accent-fg: #fff;
  --ctl: #1c1c1e; --ctl-border: #48484a; --sel: rgba(255,255,255,.08); --ok: #30d158; --warn: #ffd60a; --warn-bg: #3a3218; --err: #ff6961; --err-bg: #3d1f1f; }
.gnome.light { --bg: #fafafb; --side: transparent; --card: #fff; --card-border: rgba(0,0,6,.07); --fg: rgba(0,0,6,.85); --fg2: rgba(0,0,6,.55); --accent: #3584e4; --accent-fg: #fff;
  --ctl: rgba(0,0,6,.05); --ctl-border: transparent; --sel: rgba(0,0,6,.06); --ok: #1b8553; --warn: #9c6e03; --warn-bg: #fdf2cc; --err: #c01c28; --err-bg: #fbe4e6; }
.gnome.dark  { --bg: #222226; --side: transparent; --card: rgba(255,255,255,.08); --card-border: transparent; --fg: #fff; --fg2: rgba(255,255,255,.6); --accent: #3584e4; --accent-fg: #fff;
  --ctl: rgba(255,255,255,.1); --ctl-border: transparent; --sel: rgba(255,255,255,.08); --ok: #8ff0a4; --warn: #f8e45c; --warn-bg: #3d3519; --err: #ff7b63; --err-bg: #3f2424; }

body { font-family: var(--font); font-size: var(--fs); color: var(--fg); background: var(--bg); line-height: 1.45; user-select: none; cursor: default; }
.window { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
/* Fade in when the window first shows (a hidden web view runs no animations,
   so this starts when it is on screen). */
.window { animation: appear .18s ease-out; }
@keyframes appear { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .window { animation: none; } }
.body { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
.nav { background: var(--side); padding: 12px 8px; }
.content { padding: 28px 36px; overflow: auto; min-height: 0; outline: none; }
.win .content { background: var(--card); border-top-left-radius: 8px; border-left: 1px solid var(--card-border); border-top: 1px solid var(--card-border); }
.footer { display: flex; gap: 8px; align-items: center; padding: 16px 24px; border-top: 1px solid var(--card-border); }
.footer .spacer { flex: 1; }

h1 { font-size: var(--fs-hero); font-weight: 600; margin: 4px 0 8px; letter-spacing: -.01em; }
h2 { font-size: var(--fs-title); font-weight: 600; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.lead { color: var(--fg2); margin-bottom: 20px; }
.small { font-size: var(--fs-small); color: var(--fg2); }
.mono, code { font-family: "Cascadia Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: .86em; user-select: text; overflow-wrap: anywhere; }
a { color: var(--accent); cursor: pointer; text-decoration: underline; }

.btn { font: inherit; border-radius: var(--radius-ctl); padding: 5px 12px; min-width: 120px; border: 1px solid var(--ctl-border); background: var(--ctl); color: var(--fg); }
.btn:hover:not(:disabled) { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; }
.btn:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.win .btn { box-shadow: inset 0 -1px 0 rgba(0,0,0,.08); }

.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-ctl); color: var(--fg2); position: relative; margin-bottom: 2px; }
.steps li.current { color: var(--fg); font-weight: 600; background: var(--sel); }
.steps li.current::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); }
.steps .dot { width: 18px; height: 18px; flex: none; display: grid; place-items: center; font-size: var(--fs-small); font-weight: 600; }
.steps li.done .dot { color: var(--ok); }

.card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-card); }
.win .content .card { background: var(--bg); }
.rows .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; }
.rows .row + .row { border-top: 1px solid var(--card-border); }
.row .icon { width: 20px; height: 20px; flex: none; margin-top: 1px; display: grid; place-items: center; }
.row .text { flex: 1; min-width: 0; }
.row .title { font-weight: 500; }
.row .sub { font-size: var(--fs-small); color: var(--fg2); overflow-wrap: anywhere; }
.ok { color: var(--ok); } .err { color: var(--err); } .warnc { color: var(--warn); }
.banner { display: flex; gap: 12px; padding: 12px 16px; border-radius: var(--radius-card); margin-bottom: 14px; }
.banner.warn { background: var(--warn-bg); }
.banner.error { background: var(--err-bg); }
.banner .icon { flex: none; margin-top: 1px; }
.banner .text { user-select: text; }

.field { margin-bottom: 16px; }
.field label { display: block; margin-bottom: 6px; font-weight: 500; }
.field .help { font-size: var(--fs-small); color: var(--fg2); margin-top: 6px; }
.input { position: relative; display: flex; }
.input input { flex: 1; font: inherit; color: var(--fg); background: var(--ctl); border: 1px solid var(--ctl-border); border-bottom-color: var(--ctl-border-bottom, var(--ctl-border)); border-radius: var(--radius-ctl); padding: 6px 10px; min-width: 0; user-select: text; }
.input input:focus { outline: none; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
.reveal { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--fg2); padding: 4px 6px; border-radius: 4px; }
.reveal:hover { background: var(--sel); }
input::-ms-reveal { display: none; }
.check { display: flex; gap: 12px; align-items: center; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }

.spinner { width: 16px; height: 16px; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.appicon { width: 64px; height: 64px; margin-bottom: 12px; }
.bullets { margin: 4px 0 18px; padding: 0; list-style: none; }
.bullets li { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.bullets .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--sel); flex: none; }
details summary { cursor: pointer; color: var(--fg2); font-size: var(--fs-small); margin-top: 10px; }
.donebig { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); margin-bottom: 14px; }
.busy { display: flex; gap: 10px; align-items: center; }
.steps li.nav { cursor: pointer; }
.steps li.nav:hover:not(.current) { background: var(--sel); }
.steps .mark { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; }
.mark.ok { background: var(--ok); } .mark.fail { background: var(--err); }
.row .what { font-size: var(--fs-small); margin-top: 4px; user-select: text; }
.tools .row { padding: 8px 16px; }
.tools .name { width: 150px; flex: none; }
h3 { font-size: var(--fs); font-weight: 600; margin: 18px 0 8px; }

/* The app pages (issue #204): Fluent 2 navigation, cards and switches. */
.footer[hidden] { display: none; }
.nav.app { display: flex; flex-direction: column; align-items: stretch; padding: 14px 8px; }
.nav.app .steps { align-self: stretch; }
.nav.app .steps li { width: 100%; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 12px 18px; }
.brand b { display: block; font-weight: 600; }
.brand span { display: block; font-size: var(--fs-small); color: var(--fg2); }
.brandicon svg { width: 32px; height: 32px; display: block; }
.navicon { width: 16px; height: 16px; display: grid; place-items: center; }
.navicon svg { width: 16px; height: 16px; }
.steps li.nav { gap: 12px; color: var(--fg); }
.navspacer { flex: 1; }
.content h1 { font-size: var(--fs-hero); margin: 0 0 18px; }
.content h3 { margin: 22px 0 8px; }
.content h3.first { margin-top: 0; }
.hero { display: flex; align-items: center; gap: 18px; padding: 18px 20px; margin-bottom: 8px; }
.hero .badge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.hero.bad .badge { background: var(--err-bg); color: var(--err); }
.hero .badge.busy { background: var(--sel); }
.hero .badge svg { width: 26px; height: 26px; }
.hero .text, .app .text, .fix .text, .srow .text { flex: 1; min-width: 0; }
.htitle { font-size: var(--fs-title); font-weight: 600; line-height: 1.3; }
.sub { font-size: var(--fs-small); color: var(--fg2); overflow-wrap: anywhere; }
.fix { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 8px; background: var(--err-bg) !important; }
.srow { display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 60px; }
.card > .srow + .srow, .card > .srow + .infobar, .card > .infobar + .srow { border-top: 1px solid var(--card-border); }
.srow .title { font-weight: 400; }
.sicon { width: 20px; height: 20px; flex: none; color: var(--fg); }
.expander .srow { cursor: pointer; }
.expander .srow:hover, .steps li.nav:hover { background: var(--sel); }
.chev { width: 16px; height: 16px; color: var(--fg2); flex: none; }
.chev svg { width: 16px; height: 16px; }
.details { border-top: 1px solid var(--card-border); }
.details .row { padding-left: 20px; }
.morebody { border-top: 1px solid var(--card-border); padding: 12px 16px; }
.btn.small { min-width: 0; }
.toggle { display: flex; align-items: center; gap: 10px; color: var(--fg2); flex: none; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--ctl-border-bottom, var(--fg2)); background: var(--ctl); position: relative; transition: background .1s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg2); transition: left .1s; }
.toggle input:checked + .switch { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .switch::after { left: 23px; background: var(--accent-fg); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--fg); outline-offset: 2px; }
.toggle input:disabled + .switch { opacity: .45; }
.num { width: 80px; font: inherit; color: var(--fg); background: var(--ctl); border: 1px solid var(--ctl-border); border-bottom-color: var(--ctl-border-bottom, var(--ctl-border)); border-radius: var(--radius-ctl); padding: 5px 10px; user-select: text; }
.infobar { display: flex; gap: 12px; padding: 12px 16px; background: var(--warn-bg); }
.infobar .buttons { display: flex; gap: 8px; margin-top: 10px; }
.app { display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
.bigicon svg { width: 56px; height: 56px; display: block; }
.pill { display: inline-block; font-size: var(--fs-small); font-weight: 400; padding: 0 8px; border-radius: 10px; vertical-align: 2px; margin-left: 6px;
  background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; }
.tiles .srow { min-height: 56px; }
.tiles .srow:nth-child(n+3) { border-top: 1px solid var(--card-border); }
.tiles .srow:nth-child(odd) { border-right: 1px solid var(--card-border); }
.app .htitle { white-space: nowrap; }
.tiles + .expander { margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
</style>
</head>
<body class="win light">
<div class="window">
  <div class="body">
    <nav class="nav" aria-label="Setup steps"><ol class="steps" id="steps"></ol></nav>
    <main class="content" id="content" tabindex="-1" aria-live="polite"></main>
  </div>
  <div class="footer">
    <button class="btn" id="cancel">Cancel</button>
    <span class="spacer"></span>
    <button class="btn" id="back">Back</button>
    <button class="btn primary" id="next">Next</button>
  </div>
</div>
<script>
'use strict';
// ---- Calls to the program (wizard.Backend.Call) ----
const pending = {};
let seq = 0;
window.__pmcpDone = (id, ok, value) => {
  const p = pending[id]; delete pending[id];
  if (p) ok ? p.resolve(value) : p.reject(new Error(value));
};
function call(method, args = {}) {
  return new Promise((resolve, reject) => {
    const id = ++seq;
    pending[id] = { resolve, reject };
    window.__pmcp(id, method, args).catch(reject);
  });
}
// Dropping a file on the window would load it in place of this page.
for (const ev of ['dragover', 'drop']) addEventListener(ev, e => e.preventDefault());

// ---- Icons ----
const ICON_SVG = `<svg viewBox="0 3 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cf6"/><stop offset="1" stop-color="#5b3fd1"/></linearGradient></defs>
  <rect x="4" y="12" width="48" height="36" rx="7" fill="url(#g)"/>
  <path d="M8 18l20 15 20-15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <path d="M48 30l12 4.5v8.5c0 7.5-5.2 12.5-12 15-6.8-2.5-12-7.5-12-15v-8.5z" fill="#1fb47a" stroke="#fff" stroke-width="2.5"/>
  <path d="M42.5 43l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Each copy gets its own gradient id: the menu and About show the icon at once.
let iconSeq = 0;
const ICON = () => { const n = ++iconSeq; return ICON_SVG.replace('id="g"', `id="g${n}"`).replace('url(#g)', `url(#g${n})`); };
const I = {
  ok: (n = 18) => `<svg width="${n}" height="${n}" viewBox="0 0 20 20" role="img" aria-label="OK"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M6 10.3l2.6 2.6L14 7.6" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: `<svg width="18" height="18" viewBox="0 0 20 20" role="img" aria-label="Warning"><path d="M10 2l9 16H1z" fill="currentColor"/><path d="M10 8v4.5M10 15.2v.3" stroke="var(--warn-bg)" stroke-width="2" stroke-linecap="round"/></svg>`,
  err: `<svg width="18" height="18" viewBox="0 0 20 20" role="img" aria-label="Error"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M7 7l6 6M13 7l-6 6" stroke="var(--err-bg)" stroke-width="2" stroke-linecap="round"/></svg>`,
  eye: `<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10S5 4 10 4s8.5 6 8.5 6-3.5 6-8.5 6S1.5 10 1.5 10z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>`,
  spin: `<span class="spinner" role="status" aria-label="Working"></span>`,
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const row = (icon, cls, title, sub) => `<div class="row"><span class="icon ${cls}">${icon}</span><div class="text"><div class="title">${title}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
const banner = (kind, title, text) => `<div class="banner ${kind}"><span class="icon ${kind === 'error' ? 'err' : 'warnc'}">${kind === 'error' ? I.err : I.warn}</span><div class="text"><div><b>${title}</b></div>${text ? `<div>${text}</div>` : ''}</div></div>`;

// ---- State ----
const STEPS = ['Welcome', 'Proton Mail Bridge', 'Bridge account', 'Claude', 'Finish'];
const S = {
  step: 0, state: null, bridge: null, looking: false, confirmed: false,
  user: '', reveal: false, signing: false, signInError: '', typed: false,
  pick: {}, registering: false, registered: null, fatal: '',
  settings: null, savingSettings: false, settingsSaved: false, settingsError: '',
  view: null, status: null, checking: false, fromApp: false,
  update: null, checkingUpdate: false, askSend: false, detailsOpen: undefined, aboutMore: false,
};

// ---- Steps ----
function stepWelcome() {
  return `<div class="appicon">${ICON()}</div><h1>Set up Proton Mail MCP</h1>
    <p class="lead">Lets Claude read, organise and draft your Proton Mail, through Proton Mail Bridge on this computer. It takes about a minute.</p>
    <ol class="bullets"><li><span class="num">1</span>Find Proton Mail Bridge</li><li><span class="num">2</span>Sign in with your Bridge password</li><li><span class="num">3</span>Add it to Claude</li></ol>
    <p class="small">You need Proton Mail Bridge installed and signed in. <a data-link="bridge" tabindex="0">Get Bridge</a></p>
    ${S.state?.error ? banner('warn', 'Your earlier settings could not be read', esc(S.state.error) + ' Setup will write new ones.') : ''}`;
}

function stepBridge() {
  const head = `<h2>Proton Mail Bridge</h2><p class="lead">Setup checks that it talks to the real Proton Mail Bridge on this computer, and only to that one.</p>`;
  const b = S.bridge;
  if (S.looking || !b) return head + `<div class="card rows">${row(I.spin, '', 'Looking for Bridge…')}</div>`;
  if (!b.answers) {
    const text = b.installed
      ? `Nothing answers on ${esc(b.addr)}. Bridge is installed, but it doesn't seem to be running. Start Proton Mail Bridge and sign in, then try again.`
      : `Nothing answers on ${esc(b.addr)}, and Proton Mail Bridge doesn't seem to be installed. <a data-link="bridge" tabindex="0">Get Proton Mail Bridge</a>, sign in, then try again.`;
    return head + banner('error', b.installed ? "Bridge isn't running" : 'Bridge not found', text) +
      `<button class="btn" id="retry">Try again</button>
      <details><summary>Bridge uses another port?</summary><p class="small" style="margin-top:8px">Run <code>proton-mail-mcp setup -imap-port &lt;port&gt;</code> in a terminal, with the IMAP port Bridge shows.</p></details>`;
  }
  if (!b.isBridge) {
    return head + banner('error', 'This is not Proton Mail Bridge', `Something answers on ${esc(b.addr)}, but it is not Proton Mail Bridge. Check the IMAP port that Bridge shows and run <code>proton-mail-mcp setup -imap-port &lt;port&gt;</code> in a terminal.`) +
      `<button class="btn" id="retry">Try again</button>`;
  }
  if (b.error) return head + banner('error', "Bridge's certificate can't be trusted", esc(b.error)) + `<button class="btn" id="retry">Try again</button>`;

  let rows = row(I.ok(), 'ok', 'Bridge answers', `Proton Mail Bridge on ${esc(b.addr)}`);
  if (b.verified) rows += row(I.ok(), 'ok', "It is Proton's own Bridge", `The port belongs to a validly signed bridge.exe in Program Files: <span class="mono">${esc(b.ownerPath)}</span>`);
  else rows += row(I.warn, 'warnc', "Couldn't confirm the program on the port", b.ownerKnown ? `<span class="mono">${esc(b.ownerPath)}</span>` : 'This computer can\'t tell which program holds the port.');
  if (!b.looksLikeBridge) rows += row(I.warn, 'warnc', "The certificate isn't the kind Bridge makes");
  if (b.smtpProblem) rows += row(I.warn, 'warnc', 'SMTP could not be checked', esc(b.smtpProblem) + '. Reading mail works without it.');
  if (b.verified || S.confirmed) rows += row(I.ok(), 'ok', 'Certificate pinned', 'Only this Bridge will be trusted.');

  const confirm = b.verified ? '' : `<div class="banner warn" style="margin-top:14px"><span class="icon warnc">${I.warn}</span><div class="text">
      <div><b>Is this your Proton Mail Bridge?</b></div>
      <div style="margin-bottom:10px">Setup couldn't confirm that the program on the port is Proton Mail Bridge as you installed it.
      Only confirm if Bridge is running and signed in on this computer${b.ownerKnown ? ', and the path above is where you installed it' : ''}.</div>
      <label class="check"><input type="checkbox" id="confirm" ${S.confirmed ? 'checked' : ''}> Yes, this is my Proton Mail Bridge</label></div></div>`;
  return head + `<div class="card rows">${rows}</div>${confirm}
    <details><summary>Certificate details</summary><p class="small mono" style="margin-top:8px">SHA-256 ${esc(b.fingerprint)}</p></details>`;
}

// savedMode: an earlier setup saved a password for this username, so the
// user can sign in with it. The page never sees it: the program uses it.
const savedMode = () => !!S.state?.savedPassword && !S.typed && S.user.trim() === S.state.user;

function stepAccount() {
  const dis = S.signing ? 'disabled' : '';
  if (savedMode()) {
    return `<h2>Bridge account</h2>
    <p class="lead">You've set this up before. Sign in with the saved Bridge password, or type a new one if it changed in Bridge.</p>
    ${S.signInError ? banner('error', "Couldn't sign in", esc(S.signInError)) : ''}
    <div class="field"><label for="user">Username</label><div class="input"><input id="user" type="email" autocomplete="off" spellcheck="false" value="${esc(S.user)}" ${dis}></div></div>
    <div class="card rows">${row(I.ok(), 'ok', 'Bridge password saved', 'In ' + esc(S.state?.store) + '. It stays there: Claude never sees it.')}</div>
    <p class="small" style="margin-top:12px"><a id="typed" tabindex="0">Use another password</a></p>
    ${S.signing ? `<div class="busy small">${I.spin} Signing in to Bridge…</div>` : ''}`;
  }
  return `<h2>Bridge account</h2>
    <p class="lead">Use the username and password that <b>Bridge</b> shows, not your Proton password. In Bridge, open your account and choose <i>Mailbox details</i>.</p>
    ${S.signInError ? banner('error', "Couldn't sign in", esc(S.signInError)) : ''}
    <div class="field"><label for="user">Username</label><div class="input"><input id="user" type="email" autocomplete="off" spellcheck="false" placeholder="alice@example.com" value="${esc(S.user)}" ${dis}></div></div>
    <div class="field"><label for="pass">Bridge password</label><div class="input"><input id="pass" type="${S.reveal ? 'text' : 'password'}" autocomplete="off" spellcheck="false" ${dis} style="padding-right:36px">
      <button class="reveal" id="reveal" title="${S.reveal ? 'Hide' : 'Show'} password" aria-pressed="${S.reveal}" ${dis}>${I.eye}</button></div>
      <div class="help">Saved only in ${esc(S.state?.store)}. Claude never sees it.</div></div>
    ${S.signing ? `<div class="busy small">${I.spin} Signing in to Bridge…</div>` : ''}`;
}

function stepClaude() {
  const clients = S.state?.clients || [];
  if (!clients.length) {
    return `<h2>Add to Claude</h2><p class="lead">No Claude Desktop or Claude Code was found on this computer.</p>
      <p>To add it by hand, see README → <i>Connecting to Claude</i>, with the program at:</p><p class="mono">${esc(S.state?.exe)}</p>`;
  }
  const items = clients.map((c, i) => c.registered
    ? `<div class="row"><span class="icon ok">${I.ok()}</span><div class="text"><div class="title">${esc(c.name)}</div><div class="sub">Already added</div></div></div>`
    : `<div class="row"><label class="check" style="width:100%"><input type="checkbox" data-i="${i}" ${S.pick[c.name] !== false ? 'checked' : ''} ${S.registering ? 'disabled' : ''}><div class="text"><div class="title">${esc(c.name)}${c.other ? ': switch to this copy' : ''}</div><div class="sub">${c.other ? `Now starts another copy: <span class="mono">${esc(c.other)}</span>` : 'Found on this computer'}</div></div></label></div>`).join('');
  return `<h2>Add to Claude</h2><p class="lead">Choose where Claude gets access to your mailbox. You can change this later by running setup again.</p>
    <div class="card rows">${items}</div>
    <p class="small" style="margin-top:14px">Claude can read and organise mail and write drafts. It sends only a draft you have seen, after you switch sending on in Settings, and it can't permanently delete anything.</p>
    ${S.registering ? `<div class="busy small">${I.spin} Adding…</div>` : ''}`;
}

function stepDone() {
  const reg = S.registered || [];
  const added = reg.filter(r => r.ok).map(r => r.name);
  const failed = reg.filter(r => !r.ok);
  return `<div class="donebig">${I.ok(30)}</div><h1>You're all set</h1>
    <p class="lead">${added.length ? `Restart ${esc(added.join(' and '))}, then ask Claude: <i>“List my Proton Mail folders.”</i>` : 'Proton Mail MCP is set up, but not added to Claude yet. Run setup again to add it.'}</p>
    <div class="card rows">${row(I.ok(), 'ok', 'Connected to Proton Mail Bridge', 'Certificate pinned')}
    ${row(I.ok(), 'ok', 'Signed in as ' + esc(S.user), 'Password saved in ' + esc(S.state?.store))}
    ${added.length ? row(I.ok(), 'ok', 'Added to ' + esc(added.join(' and '))) : ''}
    ${failed.map(f => row(I.err, 'err', "Couldn't add to " + esc(f.name), esc(f.error))).join('')}</div>
    <p class="small" style="margin-top:14px">Updates install without asking anything again. To change options later, such as fetching images, or to see whether everything works, open <i>Proton Mail MCP</i> again${S.state?.platform === 'windows' ? ' from the Start menu' : ''}. If something stops working, <a data-link="help" tabindex="0">see the troubleshooting guide</a>.</p>`;
}

// ---- The app pages, once set up: Status, Settings, About ----
const VIEWS = [['status', 'Status'], ['settings', 'Settings'], ['about', 'About']];
// Hints write commands in `backticks`.
// The check writes sentences for the terminal, lower-case first.
// cap starts a sentence with a capital, but never changes an address,
// file name or path: "alice@example.com" and "config.json" stay as written.
const cap = s => { s = String(s ?? ''); return /[@.\\/:]/.test(s.split(/\s/)[0]) ? s : s.charAt(0).toUpperCase() + s.slice(1); };
const hintHTML = s => esc(cap(s)).replace(/`([^`]+)`/g, '<code>$1</code>');

// Fluent 2 line icons for the app pages (issue #204).
const L = (d, w = 1.5) => `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const G = {
  status: L('<path d="M2 10h3.5l2-5 4 10 2-5H18"/>'),
  settings: L('<circle cx="10" cy="10" r="2.6"/><path d="M10 1.8v2.4M10 15.8v2.4M18.2 10h-2.4M4.2 10H1.8M15.8 4.2l-1.7 1.7M5.9 14.1l-1.7 1.7M15.8 15.8l-1.7-1.7M5.9 5.9L4.2 4.2"/>'),
  about: L('<circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6.2v.3"/>'),
  close: L('<path d="M8 4H4v12h4M13 6l4 4-4 4M17 10H8"/>'),
  check: L('<path d="M4 10.5l4 4 8-9"/>', 2.2),
  cross: L('<path d="M5 5l10 10M15 5L5 15"/>', 2.2),
  chevDown: L('<path d="M5 8l5 5 5-5"/>'), chevUp: L('<path d="M5 12l5-5 5 5"/>'),
  image: L('<rect x="2.5" y="4" width="15" height="12" rx="2"/><circle cx="7" cy="8.2" r="1.3"/><path d="M3 14l4.5-4 3.5 3 2.5-2 4 3.5"/>'),
  send: L('<path d="M18 2L9 11M18 2l-5.5 16L9 11 2 7.5z"/>'),
  folder: L('<path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.5l2 2H16a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z"/>'),
  outbox: L('<path d="M3 11v4.5h14V11M10 3v9M6.5 6.5L10 3l3.5 3.5"/>'),
  shield: L('<path d="M10 2l6.5 2.5v5c0 4-2.8 6.8-6.5 8.5C6.3 16.3 3.5 13.5 3.5 9.5v-5z"/>'),
  app: L('<rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 10h6"/>'),
  read: L('<path d="M2 5.5l8 5 8-5M2.5 4h15v12h-15z"/>'),
  org: L('<path d="M3 6h14M3 10h9M3 14h5"/>'),
  draft: L('<path d="M13.5 3.5l3 3L7 16H4v-3z"/>'),
  trash: L('<path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/>'),
};

// A path shown the way Explorer's address bar does: the last parts under
// the user's folder, "Downloads › Proton Mail MCP".
const shortPath = p => {
  const parts = String(p || '').split(/[\\/]+/).filter(Boolean);
  const users = parts.findIndex(x => /^(users|home)$/i.test(x));
  return (users >= 0 && parts.length > users + 2 ? parts.slice(users + 2) : parts).join(' › ');
};

// The navigation pane: the app, its pages, and Close.
function appNav(v) {
  const mark = n => n === 'status' && S.status && !S.checking ? `<span class="mark ${S.status.failed ? 'fail' : 'ok'}" aria-label="${S.status.failed ? 'needs fixing' : 'works'}"></span>` : '';
  return `<div class="brand"><span class="brandicon">${ICON()}</span><div><b>Proton Mail MCP</b><span>${esc(S.state?.version || '')}</span></div></div>
    <ol class="steps">${VIEWS.map(([n, label]) => `<li class="nav ${n === v ? 'current' : ''}" data-view="${n}" tabindex="0" role="link" ${n === v ? 'aria-current="page"' : ''}><span class="navicon">${G[n]}</span>${label}${mark(n)}</li>`).join('')}</ol>
    <span class="navspacer"></span>
    <ol class="steps"><li class="nav" id="nav-close" tabindex="0" role="button"><span class="navicon">${G.close}</span>Close</li></ol>`;
}

// One row of a settings card: icon, title and a line under it, then the
// control on the right.
const srow = (icon, title, sub, control, extra = '') =>
  `<div class="srow"><span class="sicon">${icon}</span><div class="text"><div class="title">${title}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${extra}</div>${control}</div>`;
const toggle = (id, on, disabled) =>
  `<label class="toggle"><span>${on ? 'On' : 'Off'}</span><input type="checkbox" role="switch" id="${id}" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}><span class="switch" aria-hidden="true"></span></label>`;

function viewStatus() {
  const head = `<h1>Status</h1>`;
  const r = S.status;
  if (!r || S.checking) return head + `<div class="card hero"><div class="badge busy">${I.spin}</div><div class="text"><div class="htitle">Checking…</div><div class="sub">Looking for Proton Mail Bridge and signing in. This takes a few seconds.</div></div></div>`;
  const fail = r.steps.find(s => s.status === 'fail');
  const icon = { ok: [I.ok(), 'ok'], fail: [I.err, 'err'], advice: [I.warn, 'warnc'] };
  const details = r.steps.map(s => {
    const [ic, cls] = icon[s.status] || icon.advice;
    // The failing step's fix is in the red row above: not twice.
    const what = s.status === 'ok' || s === fail ? '' :
      (s.hint ? `<div class="what">${hintHTML(s.hint)}</div>` : '') +
      (s.help ? `<div class="what"><a data-help="${esc(s.help)}" tabindex="0">Help with this</a></div>` : '');
    return `<div class="row"><span class="icon ${cls}">${ic}</span><div class="text"><div class="title">${esc(s.title || s.name)}</div><div class="sub">${esc(cap(s.detail))}</div>${what}</div></div>`;
  }).join('');
  const open = S.detailsOpen ?? !!r.failed;
  const failed = r.steps.filter(s => s.status === 'fail').length;
  const hero = r.failed
    ? `<div class="card hero bad"><div class="badge">${G.cross}</div><div class="text"><div class="htitle">${esc(fail?.title || 'Something needs fixing')}</div><div class="sub">Claude can't reach your mailbox until this works.</div></div></div>
       <div class="card fix"><span class="icon err">${I.err}</span><div class="text"><div class="title">${fail?.hint ? hintHTML(fail.hint) : 'Fix it, then check again.'}</div>${fail?.help ? `<div class="sub"><a data-help="${esc(fail.help)}" tabindex="0">Help with this</a></div>` : ''}</div><button class="btn primary" id="check-again">Check again</button></div>`
    : `<div class="card hero"><div class="badge">${G.check}</div><div class="text"><div class="htitle">Everything works</div><div class="sub">Claude can reach your mailbox through Proton Mail Bridge.</div></div><button class="btn" id="check-again">Check again</button></div>`;
  const clients = (S.state?.clients || []).map(c => srow(G.app, esc(c.name),
    c.registered ? 'Connected' : c.other ? `Starts another copy: <span class="mono">${esc(c.other)}</span>` : 'Not added',
    `<span class="icon ${c.registered ? 'ok' : 'warnc'}">${c.registered ? I.ok() : I.warn}</span>`)).join('');
  return head + hero +
    `<div class="card expander"><div class="srow" id="details" tabindex="0" role="button" aria-expanded="${open}"><div class="text"><div class="title">Details</div><div class="sub">${failed ? `${failed} of ${r.steps.length} checks failed` : `${r.steps.length} checks passed`}</div></div><span class="chev">${open ? G.chevUp : G.chevDown}</span></div>
      ${open ? `<div class="rows details">${details}</div>` : ''}</div>
    ${clients ? `<h3>Used by</h3><div class="card">${clients}</div>` : ''}
    <p class="small" style="margin-top:14px">Bridge reset, a new Bridge password, or a new Claude app? <a id="setup-again" tabindex="0">Set up again</a></p>`;
}

function viewSettings() {
  const s = S.settings;
  const head = `<h1>Settings</h1>`;
  if (!s) return head + `<div class="card rows">${row(I.spin, '', 'Reading the settings…')}</div>`;
  if (!s.setUp) return head + banner('warn', 'Not set up yet', 'Set up Proton Mail MCP first: the options are saved with its settings.') + `<button class="btn" id="setup-again">Set up</button>`;
  const locked = n => s.locked[n] ? `<div class="sub warnc">Set in ${s.locked[n] === '.env' ? 'the .env file' : 'an environment variable'}, which overrides this.</div>` : '';
  const busy = S.savingSettings;
  const asking = S.askSend && !s.allowSend;
  const folder = (key, def, icon, title) => srow(icon, title,
    esc(shortPath(s[key] || def) || 'Not found: choose a folder') + (s[key] ? ' · <a data-reset="' + key + '" tabindex="0">Use default</a>' : ''),
    `<button class="btn small" data-pick="${key}" ${s.locked[key] || busy ? 'disabled' : ''}>Change…</button>`, locked(key));
  return head +
    (S.settingsError ? banner('error', "Couldn't save", esc(S.settingsError)) : '') +
    `<h3 class="first">What Claude may do</h3><div class="card">
      ${srow(G.send, 'Send drafts', 'Claude sends a draft you have seen, after asking you. At most 10 per session.', toggle('opt-send', s.allowSend || asking, s.locked.allowSend || busy), locked('allowSend'))}
      ${asking ? `<div class="infobar"><span class="icon warnc">${I.warn}</span><div class="text"><div class="title">Let Claude send email in your name?</div><div class="sub">Claude asks you before every send. Sent mail can't be taken back.</div>
        <div class="buttons"><button class="btn primary small" id="send-on">Turn on</button><button class="btn small" id="send-cancel">Cancel</button></div></div></div>` : ''}
      ${srow(G.image, 'Show images from the internet', 'Claude fetches an image a message links to, when you ask. The sender can see that you opened the message.', toggle('opt-images', s.allowRemoteImages, s.locked.allowRemoteImages || busy), locked('allowRemoteImages'))}
      ${srow(G.shield, 'Changes per session', `How many messages Claude may change, and drafts it may write, before Claude is restarted. Default ${esc(s.defaultMaxChanges)}.`,
        `<input class="num" id="opt-max" type="number" min="1" max="10000" value="${esc(s.maxChanges)}" ${s.locked.maxChanges || busy ? 'disabled' : ''} aria-label="Changes per session">`, locked('maxChanges'))}
    </div>
    <h3>Folders</h3><div class="card">
      ${folder('attachmentDir', s.defaultAttachmentDir, G.folder, 'Saved attachments')}
      ${folder('outboxDir', s.defaultOutboxDir, G.outbox, 'Files to send')}
    </div>
    <p class="small" style="margin-top:10px">${busy ? 'Saving…' : S.settingsSaved ? 'Saved. Restart Claude to use the change.' : 'Changes are saved at once. Restart Claude to use them.'}</p>`;
}

function viewAbout() {
  const st = S.state || {};
  const u = S.update;
  const pill = u && !u.error ? (u.update_available ? `<span class="pill warn">Update available</span>` : `<span class="pill">Up to date</span>`) : '';
  const result = S.checkingUpdate ? `<div class="sub">${I.spin} Checking for updates…</div>`
    : !u ? ''
    : u.error ? `<div class="sub warnc">Couldn't check for updates: ${esc(u.error)}</div>`
    : u.update_available ? `<div class="sub">${esc(u.latest)} is available. ${esc(u.how_to_update)} <a data-link="release" tabindex="0">Open the release page</a></div>`
    : `<div class="sub">${esc(u.message)}</div>`;
  const tiles = [[G.read, 'Read and search', 'Mail stays unread'], [G.org, 'Organise', 'Move, label, star, Trash'],
    [G.draft, 'Write drafts', 'New, replies and forwards'], [G.send, 'Send', 'Only a draft you have seen, when on']]
    .map(([ic, t, s]) => srow(ic, t, s, '')).join('');
  const more = S.aboutMore;
  const groups = (st.tools || []).map(g => `<h3>${esc(g.group)}</h3><div class="card rows tools">${
    g.tools.map(t => `<div class="row"><span class="name mono">${esc(t.name)}</span><div class="text sub">${esc(t.description)}</div></div>`).join('')}</div>`).join('');
  return `<h1>About</h1>
    <div class="card app"><span class="bigicon">${ICON()}</span><div class="text"><div class="htitle">Proton Mail MCP ${pill}</div>
      <div class="sub">Version ${esc(st.version)}</div><div class="sub">Lets Claude read, organise and draft your Proton Mail.</div>${result}</div>
      <button class="btn" id="check-update" ${S.checkingUpdate ? 'disabled' : ''}>Check for updates</button></div>
    <h3>What Claude can do</h3><div class="card tiles">${tiles}</div>
    <div class="card expander"><div class="srow" id="about-more" tabindex="0" role="button" aria-expanded="${!!more}"><div class="text"><div class="title">All tools, setup again, and technical details</div></div><span class="chev">${more ? G.chevUp : G.chevDown}</span></div>
      ${more ? `<div class="morebody"><p class="small">The program Claude starts: <span class="mono">${esc(st.exe)}</span>. <a id="setup-again" tabindex="0">Set up again</a></p>${groups}</div>` : ''}</div>
    <p class="small" style="margin-top:14px"><a data-link="help" tabindex="0">Help and troubleshooting</a></p>`;
}

function renderApp() {
  const v = S.view;
  $('.footer').hidden = true;
  $('nav.nav').classList.add('app');
  $('nav.nav').innerHTML = appNav(v);
  $('#content').innerHTML = !v ? `<div class="card rows">${row(I.spin, '', 'Checking…')}</div>` : v === 'status' ? viewStatus() : v === 'about' ? viewAbout() : viewSettings();
  const act = (sel, f) => document.querySelectorAll(sel).forEach(el => { el.onclick = f; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.call(el, e); } }; });
  act('[data-view]', function () { show(this.dataset.view); });
  act('#nav-close', () => call('close'));
  act('[data-help]', function () { call('openLink', { name: 'help:' + this.dataset.help }).catch(() => {}); });
  act('#setup-again', setUpAgain);
  act('#check-again', () => { if (!S.checking) runStatus(); });
  act('#details', () => { S.detailsOpen = !(S.detailsOpen ?? !!S.status?.failed); renderApp(); });
  act('#about-more', () => { S.aboutMore = !S.aboutMore; renderApp(); });
  act('#check-update', checkUpdate);
  if (v === 'settings') wireSettings(); else wire();
}

function show(view) { S.view = view; renderApp(); $('#content').focus({ preventScroll: true }); }

async function runStatus() {
  S.checking = true; S.detailsOpen = undefined; renderApp();
  try { S.status = await call('runCheck'); } catch (e) { S.status = { failed: true, steps: [{ name: 'check', title: "Couldn't run the check", status: 'fail', detail: e.message }] }; }
  S.checking = false;
  if (!S.view) S.view = S.status.failed ? 'status' : 'settings';
  renderApp();
}

function setUpAgain() {
  S.state.mode = 'setup'; S.fromApp = true; S.step = 0;
  render(); $('#content').focus({ preventScroll: true });
}

// Back from the setup steps to the app pages, checking again.
async function backToApp() {
  try { S.state = await call('state'); } catch (e) { S.fatal = e.message; render(); return; }
  S.state.mode = 'app'; S.view = 'status';
  try { S.settings = await call('getSettings'); } catch (e) { S.settingsError = e.message; }
  runStatus();
}

// Updates: GitHub is asked only when the owner clicks (issue #159).
async function checkUpdate() {
  S.checkingUpdate = true; S.update = null; renderApp();
  try { S.update = await call('checkUpdate'); } catch (e) { S.update = { error: e.message }; }
  S.checkingUpdate = false; renderApp();
}

// Settings take effect when changed: each change is saved at once, as
// Windows' own Settings do. Switching sending on asks first (issue #181).
function wireSettings() {
  const s = S.settings;
  const im = $('#opt-images'), snd = $('#opt-send'), max = $('#opt-max');
  if (im) im.onchange = e => saveSettings({ allowRemoteImages: e.target.checked });
  if (snd) snd.onchange = e => {
    if (e.target.checked && !s.allowSend) { S.askSend = true; renderApp(); return; }
    S.askSend = false; saveSettings({ allowSend: e.target.checked });
  };
  const on = $('#send-on'); if (on) on.onclick = () => { S.askSend = false; saveSettings({ allowSend: true }, true); };
  const cancel = $('#send-cancel'); if (cancel) cancel.onclick = () => { S.askSend = false; renderApp(); };
  if (max) max.onchange = e => saveSettings({ maxChanges: Number(e.target.value) });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const key = b.dataset.pick;
    try {
      const picked = await call('pickFolder', { start: s[key] || (key === 'attachmentDir' ? s.defaultAttachmentDir : s.defaultOutboxDir) });
      if (picked) saveSettings({ [key]: picked });
    } catch (e) { S.settingsError = e.message; renderApp(); }
  });
  document.querySelectorAll('[data-reset]').forEach(a => {
    const f = () => saveSettings({ [a.dataset.reset]: '' });
    a.onclick = f; a.onkeydown = e => { if (e.key === 'Enter') f(); };
  });
  wire();
}

async function saveSettings(change, confirmSend = false) {
  const s = { ...S.settings, ...change };
  S.savingSettings = true; S.settingsError = ''; S.settingsSaved = false; renderApp();
  try {
    S.settings = await call('saveSettings', { allowRemoteImages: !!s.allowRemoteImages, attachmentDir: s.attachmentDir || '', outboxDir: s.outboxDir || '',
      maxChanges: Number(s.maxChanges), allowSend: !!s.allowSend, confirmSend });
    S.settingsSaved = true;
  } catch (e) { S.settingsError = e.message; }
  S.savingSettings = false; renderApp();
}

// ---- Rendering ----
function canNext() {
  switch (S.step) {
    case 1: { const b = S.bridge; return !S.looking && b && b.answers && b.isBridge && !b.error && (b.verified || S.confirmed); }
    case 2: return !S.signing && S.user.trim() !== '' && (savedMode() || ($('#pass')?.value || '') !== '');
    case 3: return !S.registering;
    default: return true;
  }
}

function render() {
  if (S.fatal) {
    $('#content').innerHTML = banner('error', 'Setup stopped', esc(S.fatal));
    for (const id of ['#next', '#back']) $(id).style.visibility = 'hidden';
    $('#cancel').textContent = 'Close';
    return;
  }
  if (S.state?.mode === 'app') { renderApp(); return; }
  $('.footer').hidden = false;
  if (!$('#steps')) { $('nav.nav').classList.remove('app'); $('nav.nav').innerHTML = '<ol class="steps" id="steps"></ol>'; }
  $('#next').style.visibility = 'visible';
  // Keep a typed password across re-renders of the same step.
  const pass = $('#pass')?.value;
  $('#steps').innerHTML = STEPS.map((n, i) => `<li class="${i === S.step ? 'current' : i < S.step ? 'done' : ''}" ${i === S.step ? 'aria-current="step"' : ''}><span class="dot">${i < S.step ? I.ok() : i + 1}</span>${n}</li>`).join('');
  $('#content').innerHTML = [stepWelcome, stepBridge, stepAccount, stepClaude, stepDone][S.step]();
  if (pass !== undefined && $('#pass')) $('#pass').value = pass;
  const last = S.step === STEPS.length - 1;
  $('#next').textContent = last ? 'Finish' : S.step === 0 ? 'Start' : S.step === 2 ? 'Sign in' : S.step === 3 ? (S.state?.clients?.some(c => !c.registered) ? 'Add' : 'Next') : 'Next';
  $('#next').disabled = !canNext();
  // No way back once saved: the steps before it would start over.
  $('#back').style.visibility = S.step === 0 || S.step >= 3 ? 'hidden' : 'visible';
  $('#cancel').style.visibility = last ? 'hidden' : 'visible';
  $('#cancel').textContent = S.fromApp ? 'Back' : 'Cancel';
  wire();
}

function wire() {
  const u = $('#user'), p = $('#pass');
  if (u) u.oninput = e => {
    const was = savedMode();
    S.user = e.target.value;
    // Another username has no saved password: show the password field.
    if (savedMode() !== was) { render(); const nu = $('#user'); nu.focus(); nu.setSelectionRange(nu.value.length, nu.value.length); return; }
    $('#next').disabled = !canNext();
  };
  if (p) p.oninput = () => { $('#next').disabled = !canNext(); };
  for (const el of [u, p]) if (el) el.onkeydown = e => { if (e.key === 'Enter' && canNext()) next(); };
  const ty = $('#typed'); if (ty) { const f = () => { S.typed = true; S.signInError = ''; render(); $('#pass').focus(); }; ty.onclick = f; ty.onkeydown = e => { if (e.key === 'Enter') f(); }; }
  const rv = $('#reveal'); if (rv) rv.onclick = () => { S.reveal = !S.reveal; render(); $('#pass').focus(); };
  const cf = $('#confirm'); if (cf) cf.onchange = e => { S.confirmed = e.target.checked; render(); };
  const rt = $('#retry'); if (rt) rt.onclick = lookForBridge;
  document.querySelectorAll('[data-i]').forEach(el => el.onchange = e => { S.pick[S.state.clients[+e.target.dataset.i].name] = e.target.checked; });
  document.querySelectorAll('[data-link]').forEach(el => {
    const open = () => call('openLink', { name: el.dataset.link }).catch(() => {});
    el.onclick = open; el.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
}

// ---- Actions ----
async function lookForBridge() {
  S.looking = true; S.confirmed = false; S.bridge = null; render();
  try { S.bridge = await call('findBridge'); } catch (e) { S.fatal = e.message; }
  S.looking = false; render();
}

async function signIn() {
  const saved = savedMode();
  const args = saved ? { user: S.user, useSaved: true } : { user: S.user, password: $('#pass').value };
  S.signing = true; S.signInError = ''; render();
  let r;
  try { r = await call('signIn', args); } catch (e) { r = { error: e.message }; }
  S.signing = false;
  if (r.ok) { go(3); return; }
  if (r.savedFailed) S.typed = true;
  S.signInError = r.error; render();
  if ($('#pass')) { $('#pass').value = ''; $('#pass').focus(); }
  $('#next').disabled = !canNext();
}

async function register() {
  const names = (S.state.clients || []).filter(c => !c.registered && S.pick[c.name] !== false).map(c => c.name);
  const already = (S.state.clients || []).filter(c => c.registered).map(c => ({ name: c.name, ok: true }));
  S.registering = true; render();
  try { S.registered = already.concat(names.length ? await call('register', { names }) : []); } catch (e) { S.fatal = e.message; }
  S.registering = false; go(4);
}

function go(step) {
  S.step = step; S.reveal = false; S.signInError = step === 2 ? S.signInError : '';
  render();
  $('#content').focus({ preventScroll: true });
  if (step === 1) lookForBridge();
  if (step === 2) setTimeout(() => (savedMode() ? $('#next') : S.user ? $('#pass') : $('#user'))?.focus(), 0);
}

async function next() {
  if (S.state?.mode === 'app') {
    return; // the app pages have their own buttons

  }
  if (!canNext()) return;
  switch (S.step) {
    case 1:
      if (!S.bridge.verified) { try { await call('confirmCertificate'); } catch (e) { S.fatal = e.message; render(); return; } }
      return go(2);
    case 2: return signIn();
    case 3: return register();
    case 4: return S.fromApp ? backToApp() : call('close');
    default: return go(S.step + 1);
  }
}

$('#next').onclick = next;
$('#back').onclick = () => { if (S.step > 0) go(S.step - 1); };
$('#cancel').onclick = () => (S.fromApp && S.state?.mode === 'setup' ? backToApp() : call('close'));
addEventListener('keydown', e => { if (e.key === 'Escape') call('close'); });

// ---- Start ----
const platform = { windows: 'win', darwin: 'mac' };
const mq = matchMedia('(prefers-color-scheme: dark)');
function theme() { document.body.className = `${platform[S.state?.platform] || 'gnome'} ${mq.matches ? 'dark' : 'light'}`; }
mq.addEventListener('change', theme);
(async () => {
  try { S.state = await call('state'); } catch (e) { S.fatal = e.message; }
  S.user = S.state?.user || '';
  const a = S.state?.accent || {};
  if (/^#[0-9a-f]{6}$/i.test(a.light || '')) document.documentElement.style.setProperty('--sys-accent-light', a.light);
  if (/^#[0-9a-f]{6}$/i.test(a.dark || '')) document.documentElement.style.setProperty('--sys-accent-dark', a.dark);
  theme(); render();
  if (S.state?.mode === 'app') {
    // Opens on Status when a step fails, else on Settings (issue #176).
    S.view = S.state.start === 'settings' ? 'settings' : null;
    try { S.settings = await call('getSettings'); } catch (e) { S.fatal = e.message; }
    render();
    runStatus();
  }
  // The page is laid out: the window can be shown. (Not requestAnimationFrame:
  // a web view in a hidden window draws no frames.)
  window.__pmcpReady?.();
})();
</script>
</body>
</html>
